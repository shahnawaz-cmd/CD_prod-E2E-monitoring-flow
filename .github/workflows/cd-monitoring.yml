name: Classic Decoder E2E Monitoring Flow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run automatically every 6 hours for continuous monitoring
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Playwright Matrix - ${{ matrix.project }}
    timeout-minutes: 120
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ['Mobile Safari', 'Desktop Chrome', 'Mobile Chrome']

    env:
      CI: true

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Execute Playwright Matrix Project Tests (Continue On Error)
        id: playwright-test
        continue-on-error: true
        run: npx playwright test --project="${{ matrix.project }}" --reporter=blob,list

      - name: Upload Blob Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 30

      - name: Upload Test Results & Failure Artifacts (Screenshots & Traces)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 30

  consolidate-report:
    name: Consolidate Playwright Matrix HTML Report
    needs: test
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Download All Blob Report Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Matrix Blob Reports into Consolidated HTML Report
        run: npx playwright merge-reports ./all-blob-reports --reporter html

      - name: Upload Consolidated Playwright HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: playwright-report/
          retention-days: 30
