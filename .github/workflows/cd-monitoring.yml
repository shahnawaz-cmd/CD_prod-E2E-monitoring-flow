name: Classic Decoder E2E Monitoring Flow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run automatically every 6 hours for continuous monitoring
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E Tests (Mobile Safari iOS 18)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Cache Playwright WebKit Browser Binary
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright WebKit Browser & Dependencies (on Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit --with-deps

      - name: Install System OS Dependencies Only (on Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      - name: Execute Playwright E2E Monitoring Suite
        run: npx playwright test

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results & Failure Artifacts (Screenshots & Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
